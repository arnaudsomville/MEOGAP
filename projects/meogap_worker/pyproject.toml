[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11, <3.12"
name = 'meogap-worker'
description = 'MEOGAP background execution worker.'
authors = [
    { name = 'ArnaudSomville', email = 'arnaud.somville@proton.me' },
]
version = "0.1.0"
dependencies = [
    "confz>=2.0.1",
    "pydantic>=2.6.4",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.23",
    "sqlmodel>=0.0.12",
    "meogap-core",
]

[tool.uv.sources]
meogap-core = { path = "../meogap_core", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pytest>=7.4.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
]

## Ruff -------------------------------------------------------------------------------------------- ""
[tool.ruff]
include = [
    "*.py",
    "*.pyi",
    "pyproject.toml"
]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style  = "single"
indent-style = "space"
line-ending  = "lf"

[tool.ruff.lint]
select = [
    "F",
    "E", "W",
    "C90",
    "I",
    "D",
    "UP",
    "ANN",
    "B",
    "SIM",
    "S",
    "PL",
    "PERF",
    "RUF"
]
ignore = [
    "S101",
    "D203",
    "D213",
    "D407",
    "PERF203",
    "PLR0913",
    "PLR0915",
    "SIM108",
    "S603"
]

## Mypy -------------------------------------------------------------------------------------------- ""
[tool.mypy]
warn_return_any        = true
warn_unused_configs    = true
explicit_package_bases = true
namespace_packages     = true
mypy_path              = "src"
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
