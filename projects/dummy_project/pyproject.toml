[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11, <3.12"
name = 'dummy_project'
description = 'This is a template project made by Arnaud SOMVILLE'
authors = [
    { name = 'ArnaudSomville', email = 'arnaud.somville@proton.me' },
]
version = "0.1"
dependencies = [
    "confz>=2.0.1",
    "pydantic>=2.6.4",
    "fastapi>=0.115.12",
    "uvicorn>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.23",
    "sqlmodel>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "pytest>=7.4.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "sphinx>=8.0.2",
    "sphinxcontrib-apidoc>=0.5.0",
    "sphinx-rtd-theme>=3.0.0rc1",
    "myst-parser>=4.0.0",
    "httpx>=0.28.1", # Needed for mocking http requests
    "pycobertura>=4.0.0"
]

## Ruff -------------------------------------------------------------------------------------------- ""
[tool.ruff]
include = [
    "*.py",
    "*.pyi",
    "pyproject.toml"
]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style  = "single"
indent-style = "space"
line-ending  = "lf"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E", "W",
    # McCabe
    "C90",
    # isort
    "I",
    # Pydocstyle
    "D",
    # Pyupgrade
    "UP",
    # Flake8-annotations
    "ANN",
    # Flake8-bugbear
    "B",
    # Flake8-simplify
    "SIM",
    # Flake8-Bandit
    "S",
    #PyLint
    "PL",
    #Perflint
    "PERF",
    #Ruff Specific
    "RUF"
]
ignore = [
    "S101",
    "D203",
    "D213",
    "D407",
    "PERF203",
    "PLR0913",
    "PLR0915",
    "SIM108",
    "S603"
]


## Mypy -------------------------------------------------------------------------------------------- ""
[tool.mypy]
warn_return_any        = true
warn_unused_configs    = true
explicit_package_bases = true
namespace_packages     = true
mypy_path              = "src"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fsspec.*",
    "s3fs.*",
    "jsonpickle.*",
    "payload_tm_ingester.ingester.*"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
