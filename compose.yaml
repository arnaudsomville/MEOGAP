services:
  gat:
    image: meogap_gat_local:${TAG_VERSION:-latest}
    init: true
    environment:
      MEOGAP_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    restart: unless-stopped

  con:
    image: meogap_con_local:${TAG_VERSION:-latest}
    init: true
    environment:
      MEOGAP_CON_PORT: "8001"
    restart: unless-stopped

  sci:
    image: meogap_sci_local:${TAG_VERSION:-latest}
    init: true
    environment:
      MEOGAP_SCI_PORT: "8002"
    restart: unless-stopped

  cat:
    image: meogap_cat_local:${TAG_VERSION:-latest}
    init: true
    environment:
      MEOGAP_CAT_PORT: "8003"
    restart: unless-stopped

  worker:
    image: meogap_worker_local:${TAG_VERSION:-latest}
    init: true
    environment:
      MEOGAP_WORKER_LOG_LEVEL: INFO
    restart: unless-stopped

  ui:
    image: meogap_ui_local:${TAG_VERSION:-latest}
    ports:
      - "8080:80"
    depends_on:
      - gat
    restart: unless-stopped
